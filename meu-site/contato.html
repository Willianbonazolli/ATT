<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contato</title>
  </head>
  <body>
    <header>
      <img
        src="QJ1pjmKUQJGQZRO8UOPV_logos-final-14_optimized.webp"
        alt="Logo"
      />
      <h1>Contato</h1>
      <nav>
        <a href="indice.html">Inicio</a> | <a href="sobre.html">Sobre</a> |
        <a href="contato.html">Contato</a>
      </nav>
    </header>

    <main>
      <section>
        <h2>Deixe Sua Mensagem</h2>
        <p>Preencha o formulario abaixo.</p>

        <form>
          <fieldset>
            <legend>Seus dados</legend>

            <label for="nome">Nome:</label><br />
            <input
              id="nome"
              name="nome"
              type="text"
              placeholder="Seu nome completo"
              required
            /><br /><br />

            <label for="email">Email:</label><br />
            <input
              id="email"
              name="email"
              type="email"
              placeholder="seuemail@exemplo.com"
              required
            /><br /><br />

            <label for="assunto">Assunto:</label><br />
            <select id="assunto" name="assunto">
              <option value="duvida">Duvida</option>
              <option value="projeto">Projeto</option>
              <option value="parceria">Parceria</option>
            </select>
          </fieldset>

          <br />

          <fieldset>
            <legend>Mensagem</legend>

            <label for="mensagem">Escreva sua mensagem:</label><br />
            <textarea
              id="mensagem"
              name="mensagem"
              rows="6"
              cols="40"
              placeholder="Digite sua mensagem aqui"
              required
            ></textarea
            ><br /><br />

            <button type="submit">Enviar</button>
          </fieldset>
        </form>
      </section>
    </main>

    <footer>
      <p>
        Links:
        <a href="https://www.linkedin.com/in/willian-bonazzoli/">LinkedIn</a> |
        <a href="https://github.com/Willianbonazolli">GitHub</a>
      </p>
    </footer>
  </body>
</html>
